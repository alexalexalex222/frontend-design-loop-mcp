name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
      - name: Compile runtime
        run: |
          python -m py_compile \
            src/frontend_design_loop_mcp/mcp_server.py \
            src/frontend_design_loop_mcp/setup.py \
            src/frontend_design_loop_mcp/runtime_paths.py \
            src/frontend_design_loop_core/config.py \
            src/frontend_design_loop_core/mcp_code_server.py \
            src/frontend_design_loop_core/utils.py
      - name: Install browser and Linux libraries
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        run: |
          PYTHONPATH=src python -m pytest -q --import-mode=importlib

  portability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, windows-2025, macos-latest]
        python-version: ["3.10", "3.12", "3.14"]
        include:
          # Real Windows 11 kernel; x64 Python/Node run under ARM emulation.
          # This does not establish native ARM64 Python/browser support.
          - os: windows-11-arm
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ runner.os == 'Windows' && 'x64' || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          architecture: ${{ runner.os == 'Windows' && 'x64' || '' }}
      - name: Install package
        run: |
          python -m pip install '.[dev]' uv 'pytest-timeout>=2.4.0,<3'
      - name: Install Linux browser libraries
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Install browser
        run: python -m playwright install chromium
      - name: Native Windows process ownership and stdio regressions
        if: runner.os == 'Windows'
        run: python -m pytest -vv --import-mode=importlib --timeout=180 --timeout-method=thread -o faulthandler_timeout=60 tests/test_windows_jobs.py --junitxml=out/native-windows-tests.xml
      - name: Complete suite including native process ownership and source replay
        id: full_suite
        # Collect independent package evidence even when a test fails. The
        # terminal check below still requires the original test outcome.
        continue-on-error: true
        run: python -m pytest -vv --import-mode=importlib --timeout=180 --timeout-method=thread -o faulthandler_timeout=60 --junitxml=out/portability-tests.xml ${{ runner.os == 'Windows' && '--ignore=tests/test_windows_jobs.py' || '' }}
      - name: Installed toolkit stdio smoke
        run: python scripts/smoke_toolkit_stdio.py
      - name: Real stdio and responsive preview smoke
        run: python scripts/smoke_mcp_stdio.py --preview
      - name: Build distributions
        run: python -m build --outdir out/ci-distributions
      - name: Clean pip wheel, npm preview, interactions and automated eval
        run: python scripts/verify_installed_package.py --artifact out/ci-distributions --out-dir out/ci-wheel
      - name: Clean uv tool sdist, npm preview, interactions and automated eval
        run: python scripts/verify_installed_package.py --artifact out/ci-distributions --distribution sdist --installer uv --out-dir out/ci-sdist
      - name: Require full suite success
        if: always() && steps.full_suite.outcome != 'success'
        run: python -c "raise SystemExit('The full suite failed; see its test log and JUnit artifact.')"
      - name: Preserve native platform receipts and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portability-${{ matrix.os }}-python-${{ matrix.python-version }}
          if-no-files-found: ignore
          path: |
            out/native-windows-tests.xml
            out/portability-tests.xml
            out/ci-wheel/*.json
            out/ci-wheel/*.log
            out/ci-wheel/browser evidence/**
            out/ci-wheel/automated evidence/**
            out/ci-sdist/*.json
            out/ci-sdist/*.log
            out/ci-sdist/browser evidence/**
            out/ci-sdist/automated evidence/**

  release-smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium
      - name: Release verification
        run: |
          ./scripts/verify_release.sh --python=python --skip-github-install
